openapi: 3.0.3
info:
  title: Library Books Mock API
  version: 1.0.0
  description: Mock API specification for the library /books prefix.
servers:
  - url: http://localhost:8080
paths:
  /books/:
    get:
      tags:
        - books
      summary: Get books
      description: Return books filtered, sorted, and paginated by query parameters.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookStatus"
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortField"
        - name: order
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Books returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookCollection"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags:
        - books
      summary: Create a book
      description: Create a new book and return it with a generated UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Book created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "422":
          $ref: "#/components/responses/ValidationError"
  /books/{book_id}:
    get:
      tags:
        - books
      summary: Get a book
      description: Return a single book by UUID.
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - books
      summary: Delete a book
      description: Delete a book by UUID. This endpoint is idempotent.
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204":
          description: Book deleted successfully or did not exist.
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    BookId:
      name: book_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    BookStatus:
      type: string
      enum:
        - available
        - issued
    SortField:
      type: string
      enum:
        - title
        - year
    SortOrder:
      type: string
      enum:
        - asc
        - desc
    BookCreate:
      type: object
      required:
        - title
        - author
        - status
        - publication_year
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          x-faker: lorem.words
        author:
          type: string
          minLength: 1
          maxLength: 200
          x-faker: name.findName
        description:
          type: string
          minLength: 0
          maxLength: 2000
          default: ""
          x-faker: lorem.sentence
        status:
          $ref: "#/components/schemas/BookStatus"
        publication_year:
          type: integer
          minimum: 1000
          maximum: 2026
          x-faker: random.number
    Book:
      type: object
      required:
        - id
        - title
        - author
        - description
        - status
        - publication_year
      properties:
        id:
          type: string
          format: uuid
          x-faker: random.uuid
        title:
          type: string
          x-faker: lorem.words
        author:
          type: string
          x-faker: name.findName
        description:
          type: string
          x-faker: lorem.sentence
        status:
          $ref: "#/components/schemas/BookStatus"
        publication_year:
          type: integer
          minimum: 1000
          maximum: 2026
          x-faker: random.number
    BookCollection:
      type: object
      required:
        - items
        - limit
        - offset
        - total
        - count
        - next_offset
        - prev_offset
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          nullable: true
          minimum: 0
        total:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 0
        next_offset:
          type: integer
          nullable: true
          minimum: 0
        prev_offset:
          type: integer
          nullable: true
          minimum: 0
        next_cursor:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
